[project]
name = "ticketflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mateo-balciunas", email = "mateo.balciunas@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ticketflow = "ticketflow:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]


